  <link rel="stylesheet" href="../assets/css/gallery.css">
  <script>
    /* Apply a saved light/dark choice before first paint (no flash). */
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (error) { /* storage blocked: follow the system setting */ }
  </script>
  <script src="../assets/js/theme-toggle.js" defer></script>
  <script src="../assets/js/lightbox.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="navbar">
    <div class="container navbar__inner">
      <a class="navbar__brand" href="../"><b>Quynh-Lan</b> Le</a>
      <nav aria-label="Primary">
        <ul class="nav">
          <li><a href="../">about</a></li>
          <!-- nav-gallery:start --><li><a href="./" aria-current="page">gallery</a></li><!-- nav-gallery:end -->
          <li><a href="../cv/">CV</a></li>
          <li>
            <button class="theme-toggle" type="button" aria-label="Switch to dark theme">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/></svg>
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <article class="post">
      <header>
        <h1 class="post-title">gallery</h1>
      </header>

      <!-- The photo cards between the markers are generated by scripts/build-gallery.py
           from assets/img/gallery/photos.json. Do not edit them by hand. -->
      <div class="gallery" data-lightbox>
        <!-- gallery:start -->
        <figure class="gallery__item">
          <a href="../assets/img/gallery/photo-01.jpg"><img src="../assets/img/gallery/photo-01.jpg" alt="A smiling young woman resting her head on her hands, wearing a patterned knit sweater, against a plain grey background." loading="lazy"></a>
        </figure>
        <figure class="gallery__item">
          <a href="../assets/img/gallery/photo-02.jpg"><img src="../assets/img/gallery/photo-02.jpg" alt="A young woman with a happy, closed-eye expression, pointing at both cheeks with her index fingers, wearing a grey and brown knit sweater over a collared shirt." loading="lazy"></a>
        </figure>
        <figure class="gallery__item">
          <a href="../assets/img/gallery/photo-03.jpg"><img src="../assets/img/gallery/photo-03.jpg" alt="A smiling young woman in a black jacket, one hand raised beside her face, in front of a black backdrop with silver glitter stars." loading="lazy"></a>
        </figure>
        <!-- gallery:end -->
      </div>
    </article>
  </main>

  <footer class="footer">
    <p>© Copyright 2026 <span lang="vi">Quynh-Lan Le</span>. Design inspired by <a href="https://github.com/alshedivat/al-folio" rel="noopener">al-folio</a>. Hosted by GitHub Pages.</p>
  </footer>
</body>
</html>
